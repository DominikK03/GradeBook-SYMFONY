services:
    php:
        build:
            context: ./docker
            dockerfile: Dockerfile
        restart: unless-stopped
        container_name: gradebook-app
        working_dir: /var/www
        volumes:
            - ./:/var/www
        depends_on:
            database:
                  condition: service_healthy
            rabbitmq:
                condition: service_healthy

    nginx:
        image: nginx:latest
        restart: unless-stopped
        container_name: gradebook-server
        depends_on:
            - php
        ports:
            - 8000:80
        volumes:
            - ./:/var/www
            - ./docker/nginx:/etc/nginx/conf.d
    database:
        image: mariadb:${MARIADB_VERSION:-lts}
        environment:
            MARIADB_DATABASE: ${MYSQL_DATABASE:-gradebookdb}
            MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
            MARIADB_PASSWORD: ${MYSQL_PASSWORD:-root}
            MARIADB_USER: ${MYSQL_USER:-app}
        healthcheck:
            test: [ "CMD", "mariadb-admin", "ping", "-h", "localhost" ]
            timeout: 5s
            retries: 5
            start_period: 60s
        ports:
            -   "3306:3306"
        volumes:
            - database_data:/var/lib/mysql
        container_name: gradebook-db

    rabbitmq:
        image: rabbitmq:3.13-management
        restart: unless-stopped
        container_name: gradebook-rabbitmq
        environment:
            RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
            RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin}
        ports:
            - "5672:5672"   # AMQP port
            - "15672:15672" # Management UI
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "ping"]
            interval: 30s
            timeout: 10s
            retries: 3

volumes:
    database_data:
    rabbitmq_data:
